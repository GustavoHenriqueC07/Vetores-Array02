<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercício 1</title>
<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.container{
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 400px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
}

h1{
    color: #1e3c72;
}

input{
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border: 2px solid #ccc;
    border-radius: 8px;
}

button{
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
    font-weight: bold;
}

#btnAdicionar{
    background-color: #28a745;
    color: white;
}

#btnMostrar{
    background-color: #007bff;
    color: white;
}

button:hover{
    opacity: 0.9;
}

#contador{
    margin-top: 10px;
    font-weight: bold;
}

#resultado{
    margin-top: 15px;
    text-align: left;
}

ul{
    padding-left: 20px;
}
</style>
</head>
<body>

<div class="container">
<h1>Cadastro de Nomes</h1>

<input type="text" id="nome" placeholder="Digite um nome">

<br>
<button id="btnAdicionar" onclick="adicionarNome()">
    Adicionar
</button>
<button id="btnMostrar" onclick="mostrarInvertido()">
    Mostrar Invertido
</button>
<p id="contador">0/7 nomes cadastrados</p>

<div id="resultado"></div>
</div>

<script src="script.js"></script>
</body>
</html>
